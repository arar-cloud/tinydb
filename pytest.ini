[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb --tb=short
timeout = 30
timeout_method = thread
markers =
    stability: marks tests as stability/reliability validation (deselect with '-m "not stability"')
    retry: marks tests that validate retry logic and idempotency
    chaos: marks tests that simulate failure scenarios
    concurrent: marks tests for multi-threaded/multi-process scenarios
    slow: marks tests as slow (deselect with '-m "not slow"')
    flaky: marks tests known to have intermittent failures
addopts = --strict-markers
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
python_files = test_*.py
python_classes = Test*
python_functions = test_*
