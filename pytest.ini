[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb --timeout=10
timeout_method=thread
markers=
    file_io_failures: tests for file I/O resilience and transient failures
    concurrent_access: tests for concurrent read/write stress scenarios
    idempotency: tests for idempotent operation validation across retries
    stability: stability regression and reliability tests