[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb
markers =
    stability: marks tests as stability and reliability checks (deselect with '-m "not stability"')
    retry: marks tests validating retry logic and transient failure handling
    resilience: marks tests verifying database operation resilience
    concurrency: marks tests validating behavior under concurrent retry scenarios
    flaky: marks tests that may intermittently fail due to timing or I/O