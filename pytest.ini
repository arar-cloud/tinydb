[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb --cov-report html:htmlcov --timeout=30 -n auto --dist loadscope
markers=
    retry: mark test as requiring retry validation
    concurrent: mark test as concurrent access pattern validation
    idempotent: mark test as idempotency validation
    mobile: mark test as mobile platform-specific
    chaos: mark test as chaos/failure scenario testing
testpaths=tests
python_files=test_*.py conftest.py
python_classes=Test*
python_functions=test_*
minversion=7.0
[coverage:run]
branch=True
source=tinydb
[coverage:report]
exclude_lines=
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
fail_under=80