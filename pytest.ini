[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb --benchmark-disable
markers =
    benchmark: marks tests as performance benchmarks (deselect with '-m "not benchmark"')
    slow: marks tests as slow/performance-sensitive
    memory: marks tests for memory profiling
    profile: marks tests that should be profiled with line_profiler
benchmark_min_rounds = 5
benchmark_warmup = true
benchmark_disable_gc = true