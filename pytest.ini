[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb
markers =
    mobile: tests for mobile client integration
    backend: tests for backend/server stability
    integration: tests for mobile-backend integration
    async: tests requiring async support
    slow: slow running tests
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
