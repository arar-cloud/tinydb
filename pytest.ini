[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb
testpaths=tests
python_files=test_*.py
python_classes=Test*
python_functions=test_*
# Markers for categorizing tests
markers=
    concurrent: concurrent access tests
    mobile: mobile deployment scenario tests
    backend: backend deployment scenario tests
    chaos: chaos engineering and fault injection tests
    integration: integration tests with simulated network conditions