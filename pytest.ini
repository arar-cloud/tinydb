[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb
markers =
    retry: tests for retry logic and transient failure handling
    chaos: tests for chaos engineering and fault injection
    concurrent: tests for concurrent access and file locking
    timeout: tests for timeout configuration and enforcement
    resilience: tests for graceful degradation and resilience patterns
    py310: tests for Python 3.10 specific behavior
    py311: tests for Python 3.11 specific behavior
    py312: tests for Python 3.12 specific behavior
    py313: tests for Python 3.13 specific behavior
    py314: tests for Python 3.14 specific behavior