[pytest]
addopts = -vv --tb=short --capture=no --log-cli=true --log-cli-level=DEBUG --strict-markers --cov-append --cov-report term --cov tinydb
markers =
    backend: mark test as backend stack test
    mobile: mark test as mobile stack test
    stability: mark test as stability or integration test
    integration: mark test as integration test
markers =
    backend: mark test as backend stack test
    mobile: mark test as mobile stack test
    stability: mark test as stability or integration test
    integration: mark test as integration test
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = tests.log
log_file_level = DEBUG
