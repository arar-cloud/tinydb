[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb --strict-markers --log-cli=true --timeout=10 --reruns=3 --reruns-delay=0.1 -n auto
log_cli_level=DEBUG
log_level=DEBUG
log_file=tests/pytest.log
log_file_level=DEBUG
timeout=10
timeout_method=thread
markers=
    transient_failure: marks tests that validate transient failure handling
    concurrent_access: marks tests validating concurrent read/write behavior
    idempotent: marks tests validating idempotent operation behavior
    resource_exhaustion: marks tests validating behavior under resource constraints
    chaos_injection: marks tests that inject faults into storage I/O operations
    retry_resilience: marks tests that validate retry behavior and consistency
    backend_variant: marks tests to run across different storage backend implementations
    flaky: marks tests known to be intermittently failing (auto-rerun with --reruns)
    no_cov: marks tests to exclude from coverage (e.g., timeout/concurrency harness tests)
    disk_full: marks tests simulating disk exhaustion (ENOSPC) scenarios
    permission_denied: marks tests simulating permission denied failures
    file_lock: marks tests simulating file lock contention
    emfile: marks tests simulating too many open files (EMFILE) failures
    enomem: marks tests simulating out of memory (ENOMEM) failures
    property_test: marks hypothesis property-based tests for retry consistency
    retry_boundary: marks tests validating behavior at retry boundary conditions
testpaths=tests
python_files=test_*.py
python_classes=Test*
python_functions=test_*
minversion=7.0
xfail_strict=true
tmp_path_retention_count=3
tmp_path_retention_policy=failed

[tool:pytest]
hypothesis_profile = stressed
hypothesis_seed = 0
addopts = -v --hypothesis-show-statistics