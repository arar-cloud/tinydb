[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb
testpaths=tests
python_files=test_*.py
python_classes=Test*
python_functions=test_*
markers=
    security: mark test as security-focused
    injection: mark test as injection attack scenario
    traversal: mark test as path traversal scenario
    permission: mark test as file permission scenario
    validation: mark test as input validation scenario
    dos: mark test as denial of service scenario
    immutability: mark test as immutability check scenario
    core: mark test as core functionality test
    integration: mark test as integration test