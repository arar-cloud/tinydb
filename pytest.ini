[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb --timeout=10 --log-cli=true --log-cli-level=DEBUG --log-level=DEBUG
timeout = 10
testpaths = tests
python_files = test_*.py
markers =
    retry: mark test for retry validation
    fault_injection: mark test for chaos/fault injection scenarios
    integration: mark test as integration test
    state_recovery: mark test for database state recovery validation
