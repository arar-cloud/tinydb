[pytest]
# Test discovery and execution
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output and reporting
addopts = 
    --verbose
    --strict-markers
    --cov-append
    --cov-report term
    --cov tinydb
    -ra
    --tb=short

# Markers for platform-specific tests
markers =
    backend: backend-specific tests (core database functionality)
    mobile: mobile-specific tests (performance-critical paths)
    web: web-specific tests (web framework integration)
    integration: integration tests spanning multiple components
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_json: tests requiring JSON storage support
    requires_memory: tests requiring memory storage support

# Python and environment settings
minversion = 7.0
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning