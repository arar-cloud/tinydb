[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb
testpaths=tests
python_files=test_*.py
python_classes=Test*
python_functions=test_*
markers=
    performance: marks tests as performance benchmarks (deselect with '-m "not performance"')
    memory: marks tests as memory profiling tests
    latency: marks tests as latency benchmarks
benchmark_only=false
benchmark_warmup=true
benchmark_warmup_rounds=1
