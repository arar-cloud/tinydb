[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb --timeout=30 --tb=short
markers =
    retry: mark test for retry execution on transient failures
    isolation: mark test requiring isolated execution
    chaos: mark test injecting transient failures
    stress: mark test validating behavior under sustained load
    concurrent: mark test validating thread-safety and concurrent access
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
