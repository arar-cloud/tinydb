[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb --strict-markers --log-cli=true
log_cli_level=DEBUG
log_level=DEBUG
log_file=tests/pytest.log
log_file_level=DEBUG
markers=
    transient_failure: marks tests that validate transient failure handling
    concurrent_access: marks tests validating concurrent read/write behavior
    idempotent: marks tests validating idempotent operation behavior
    resource_exhaustion: marks tests validating behavior under resource constraints