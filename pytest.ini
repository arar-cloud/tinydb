[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --verbose --cov-append --cov-report term --cov tinydb --strict-markers -p no:cacheprovider
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    stability: marks tests as stability/backend tests
    mobile: marks tests as mobile-backend integration tests
    concurrent: marks tests involving concurrent operations
log_cli = true
log_cli_level = INFO
log_file = test_debug.log
log_file_level = DEBUG
timeout = 30
timeout_method = thread