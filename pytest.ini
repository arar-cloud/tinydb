[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb --tb=short --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Stability controls for intermittent failures
timeout = 30
timeout_method = thread
junit_family = xunit2

# Failure diagnostics
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
capture_method = fd

# Markers for test categorization
markers =
    backend: marks tests as backend integration tests
    mobile: marks tests as mobile backend simulation tests
    flaky: marks tests as known intermittent failures (deselect with '-m "not flaky"')
    integration: marks tests as integration tests requiring fixtures
    async: marks tests as asynchronous operations
