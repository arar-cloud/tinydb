[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb --timeout=300
markers =
    stability: stability and resilience tests requiring retry/recovery validation
    retry: tests validating retry mechanisms and transient failure recovery
    concurrent: tests validating concurrent access patterns and race conditions
    corruption: tests validating data corruption detection and recovery
    sequential: tests validating deterministic behavior across multiple runs
    resource_exhaustion: tests validating behavior under resource constraints
    io_failure: tests simulating transient I/O errors and file system constraints
    slow: slow integration and stability tests (deselect with -m 'not slow')
    integration: integration tests combining multiple components
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
