[pytest]
addopts = --verbose --cov-append --cov-report term --cov-report term-missing --cov tinydb --cov-branch --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: unit tests for core database operations
    integration: integration tests for storage backends
    concurrent: tests for concurrent access and thread safety
    mobile: tests for mobile backend contract validation
    stability: tests for backend stability under load
    slow: slow running tests
minversion = 7.0
xfail_strict = false
