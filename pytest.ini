[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb --strict-markers --cov-branch
markers =
    retry: mark test as requiring retry resilience validation
    concurrent: mark test as validating concurrent access patterns
    idempotent: mark test as validating idempotent operation behavior
    fileio: mark test as validating file I/O stability and recovery
    stress: mark test as stress testing rapid successive operations
    teardown_resilience: mark test as validating cleanup and exception handling during teardown
    memory_exhaustion: mark test as validating behavior under memory pressure
timeout = 30
timeout_method = thread