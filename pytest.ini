[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb --timeout=30 --reruns=2 --reruns-delay=1
testpaths=tests
python_files=test_*.py
python_classes=Test*
python_functions=test_*
markers=
    concurrent: mark test as concurrent access/thread-safety validation
    resilience: mark test as resilience/retry/timeout validation
    stress: mark test as stress/high-frequency/edge-case validation
    flaky: mark test as known flaky and enable retry
timeout_method=thread
