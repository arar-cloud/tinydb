[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb --strict-markers --tb=short
timeout = 300
timeout_method = thread
markers =
    flaky: marks test as flaky and may retry on failure
    slow: marks test as slow (deselect with '-m "not slow"')
    stress: marks test as stress test (requires --stress to run)
    concurrent: marks test as concurrent access test
    mobile: marks test for mobile/embedded scenarios
