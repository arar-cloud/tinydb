[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb
testpaths=tests
python_files=test_*.py
python_classes=Test*
python_functions=test_*
markers=
    stability: Stability and reliability tests
    retry: Retry behavior and idempotency tests
    corruption: Data corruption detection and recovery tests
    concurrent: Concurrent transaction and stress tests
    migration: Backward compatibility and schema migration tests
    resources: Resource cleanup and memory leak detection tests