[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb --benchmark-only --benchmark-autouse -n 1
markers =
    performance: mark test as a performance benchmark
    benchmark: mark test for benchmark measurement
    profile: mark test for profiling with memory-profiler
benchmark_warmup = true
benchmark_warmup_iterations = 1
benchmark_disable_gc = true
benchmark_min_rounds = 5
addopts_profiling = --benchmark-compare --benchmark-compare-fail=min:5%
python_files = test_*.py
python_classes = Test*
python_functions = test_*