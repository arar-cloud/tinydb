[pytest]
minversion = 7.0
addopts = --verbose --cov-append --cov-report term --cov tinydb --tb=short -m "not skip_on_ci"
testpaths = tests
norecursedirs = .git .tox docs build dist *.egg
markers =
    backend: marks tests as backend-specific failures for cross-platform debugging
    mobile: marks tests as mobile-specific failures for cross-platform debugging
    python: marks tests as python version-specific failures for version matrix testing
    regression: marks tests as regression/active failure tests for root cause isolation
    skip_on_ci: marks tests to skip in CI environments
    slow: marks tests as slow and may be deselected in quick runs
timeout = 300
timeout_method = thread
test_order_seed = 1234
