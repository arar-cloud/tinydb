[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb --timeout=30 --reruns=2 --reruns-delay=1
testpaths=tests
python_files=test_*.py
python_classes=Test*
python_functions=test_*
markers=
    concurrent: mark test as concurrent access/thread-safety validation (requires locks/atomic operations)
    resilience: mark test as resilience/retry/timeout validation (requires exponential backoff/circuit breaker)
    stress: mark test as stress/high-frequency/edge-case validation (large documents, JSON serialization, file I/O)
    flaky: mark test as known flaky and enable automatic retry on failure
    slow: mark test as slow running (timeout > 10s)
    race: mark test as race-condition validator (concurrent writes)
addopts=--strict-markers
timeout_method=thread
