[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb --timeout=30

markers =
    transient: mark test as validating transient failure recovery (disk I/O, timeouts, network)
    flaky: mark test as potentially flaky; requires retry validation
    concurrency: mark test as checking race conditions and concurrent access patterns
    retry: mark test as validating retry behavior and resilience
    stability: mark test as part of stability/reliability validation
    slow: mark test as slow running

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
