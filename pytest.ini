[pytest]
addopts=--verbose --cov-append --cov-report term --cov tinydb
markers =
    benchmark: marks tests as benchmark tests (deselect with '-m "not benchmark"')
    profile: marks tests as memory/cpu profile tests (deselect with '-m "not profile"')
    performance: marks tests as performance-critical tests

[tool:pytest]
benchmark_min_rounds = 5
benchmark_warmup = true
benchmark_save = performance_baselines
benchmark_compare = 0001
benchmark_compare_fail = mean:10%
benchmark_max_time = 1.0
benchmark_min_time = 0.000005
benchmark_sort = fullname
python_files = test_*.py
python_classes = Test*
python_functions = test_*