[pytest]
addopts = --verbose --cov-append --cov-report term --cov tinydb --timeout=300 --tb=short
testpaths = tests
python_files = test_*.py
markers =
    concurrent: marks tests as concurrent operation stress tests (deselect with '-m "not concurrent"')
    chaos: marks tests as chaos/fault injection tests (deselect with '-m "not chaos"')
    slow: marks tests as slow running (deselect with '-m "not slow"')
    py310: Python 3.10 specific tests
    py311: Python 3.11 specific tests
    py312: Python 3.12 specific tests
    py313: Python 3.13 specific tests
    py314: Python 3.14 specific tests
    pypy: PyPy specific tests
xfail_strict = False
