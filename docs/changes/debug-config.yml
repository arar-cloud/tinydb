# CI/CD Failure Log Integration for Debugging
# This configuration enables failure artifact capture for root cause analysis

name: Debug Configuration

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'tinydb/**'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'mypy.ini'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with debug output
        run: pytest --tb=long --capture=no -v
        continue-on-error: true
      - name: Capture test artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-failures-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            **/*.log
            **/test-results/
