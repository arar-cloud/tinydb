[compatibility]
python_versions = ["3.10", "3.11", "3.12", "3.13", "3.14"]
runtimes = ["cpython", "pypy"]
runtimes_description = "Test suite covers CPython 3.10-3.14 for standard behavior and PyPy for alternative runtime characteristics. Mobile backends may rely on specific CPython versions with different concurrency behavior."

[testing]
concurrent_operations = true
max_concurrent_threads = 16
max_concurrent_processes = 4
timeout_per_test_sec = 300

[chaos_engineering]
fault_injection_enabled = true
supported_scenarios = [
    "file_corruption",
    "timeout_simulation",
    "file_lock_contention",
    "crash_recovery",
    "partial_writes",
]

[resilience]
retry_library = "tenacity"
retry_validation_required = true
include_markers = ["concurrent", "chaos", "slow"]

[dependencies]
resilience_packages = ["tenacity>=8.2.3", "pydantic>=2.0"]
test_packages = ["pytest-timeout>=2.1.0", "pytest-xdist>=3.5.0", "pytest-mock>=3.12.0"]

[validation]
retry_behavior_consistency = "All retry attempts must converge to identical state"
concurrency_safety = "File lock contention and concurrent reads/writes must not corrupt database"
crash_recovery = "Partial writes must be recoverable to last consistent state"
