version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      - python -m pip install --upgrade pytest pytest-cov
    post_install:
      - python -m pytest tests/ -v --timeout=300 -m 'not slow'

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev
        - docs

formats: all
