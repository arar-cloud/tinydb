version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - git
  jobs:
    post_checkout:
      - git log --oneline -n 5

# Build isolation and security constraints
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_build:
      - echo "Build completed with isolated environment"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats: all

# Security scanning and source context
include_source: true
include_vcs: true

# Security headers and HTTPS enforcement
https: true
redirects: {}
default_version: stable

# Build environment and artifact security
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - git log --oneline -n 5
    pre_build:
      - echo "Verifying build integrity"

# Security scanning and vulnerability checks
security:
  automated_security_scanning: true
