version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# Include new stability documentation
include_patterns:
  - "docs/RETRY_STRATEGY.md"
  - "docs/MOBILE_RELIABILITY.md"

# Exclude non-documentation files
exclude_patterns:
  - "tests/**"
  - "**/.git/**"
  - "**/.github/**"

formats: all
