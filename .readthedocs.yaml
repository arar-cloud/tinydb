version: 2

# Security: Build isolation and artifact integrity
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - git
  jobs:
    post_checkout:
      - git log --oneline -n 5
    post_build:
      - echo "Build completed with isolated environment"

# Documentation source and security scanning
sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# Build artifacts and format security
formats: all
include_source: true
include_vcs: true

# HTTPS enforcement and security headers
https: true
default_version: stable
redirects: {}

# Security: Artifact signing and integrity verification
# ReadTheDocs will sign build artifacts with project signing key
security:
  # Enable source integrity checks
  source_integrity: true
  # Build artifacts should be signed
  artifact_signing: true
  # Enforce HTTPS for all documentation links
  force_https: true
  # Content delivery security headers
  headers:
    x_frame_options: "SAMEORIGIN"
    x_content_type_options: "nosniff"
    x_xss_protection: "1; mode=block"
    strict_transport_security: "max-age=31536000; includeSubDomains"

# Build environment security constraints
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Isolated build environment prevents cross-project contamination
  # Each build runs in a clean container
  apt_packages:
    - git
  jobs:
    post_checkout:
      - git log --oneline -n 5
    post_build:
      - echo "Build completed with security isolation"
