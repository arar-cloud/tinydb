# ReadTheDocs Build Configuration
# Security hardening: All dependencies pinned to specific versions for reproducible builds
# Before updating versions: run security audit on new dependency versions
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12.0"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements-docs.txt

formats: all
