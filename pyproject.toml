[project]
name = "tinydb"
version = "4.8.2"
description = "TinyDB is a tiny, document oriented database optimized for your happiness :)"
authors = [{ name = "Markus Siemens", email = "markus@m-siemens.de" }]
requires-python = ">=3.10,<4"
readme = "README.rst"
license = "MIT"
keywords = [
    "database",
    "nosql",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/msiemens/tinydb"
Documentation = "https://tinydb.readthedocs.org/"
Changelog = "https://tinydb.readthedocs.io/en/latest/changelog.html"
Issues = "https://github.com/msiemens/tinydb/issues"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-pycodestyle~=2.3",
    "pytest-cov~=7.0",
    "pycodestyle~=2.10",
    "sphinx==8.1.3",
    "coveralls~=4.0",
    "pyyaml~=6.0",
    "pytest-mypy~=1.0 ; platform_python_implementation != 'PyPy'",
    "types-PyYAML~=6.0",
    "pytest-timeout==2.1.0",
    "pytest-xdist==3.5.0",
    "hypothesis==6.92.2",
    "tenacity==8.2.3",
]

[tool.hatch.build.targets.sdist]
include = [
    "tinydb",
    "tests",
]

[tool.hatch.build.targets.wheel]
include = ["tinydb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
skip_covered = false

[tool.tinydb]
stability_target = "99.9% uptime for file-based storage operations"
recovery_documentation = "docs/reliability/failure_modes.md"
stability_sla_documentation = "docs/changes/reliability_sla.md"

[tool.tinydb.metrics]
uptime_target_percent = 99.9
error_budget_minutes_per_30days = 43.2
rto_target_seconds = 5
rpo_target_seconds = 0
max_retry_attempts = 5
initial_retry_delay_ms = 100
max_retry_delay_ms = 5000
jitter_fraction = 0.1

[tool.tinydb.alerts]
failure_alert_threshold = 2
failure_rate_threshold_percent = 5.0
failure_rate_window_seconds = 60
emfile_ulimit_target = 4096
enomem_recovery_enabled = true
