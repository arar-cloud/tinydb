[mypy]
plugins = tinydb/mypy_plugin.py
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
strict_optional = True
check_untyped_defs = True
# Security-focused: Ensure input parameters are properly typed
disallow_untyped_defs = False
# Allow gradual typing but encourage security-conscious developers to add types

[mypy-tinydb.security]
disallow_untyped_defs = True
disallow_incomplete_defs = True
warn_return_any = True
# Security module requires strict typing for input validation functions
